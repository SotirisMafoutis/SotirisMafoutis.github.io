<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | SotirisM</title>
    <link rel="icon" type="image/png" href="images/Sotiris_logo.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="contact-hero">
        <div class="hero-overlay"></div>
        <div class="container">
            <div class="contact-wrapper">
                
                <div class="contact-info">
                    <span class="badge">Get in touch</span>
                    <h1>Let's build something <span class="gradient-text">epic</span>.</h1>
                    <p>Έχεις μια ιδέα; Ας την κάνουμε πραγματικότητα. Στείλε μου ένα μήνυμα και θα σου απαντήσω εντός 24 ωρών.</p>
                    
                    <div class="info-items">
                        <div class="info-item">
                            <i class="fas fa-envelope"></i>
                            <div>
                                <h4>Email</h4>
                                <p>sotiris.mafoutis@gmail.com</p>
                            </div>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-location-dot"></i>
                            <div>
                                <h4>Location</h4>
                                <p>Athens, Greece</p>
                            </div>
                        </div>
                    </div>

                    <div class="social-links">
                        <a href="https://github.com/SotirisMafoutis" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                            <i class="fab fa-github"></i>
                        </a>
                        <a href="https://www.linkedin.com/in/σωτήριος-μαφούτης-816600253" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                            <i class="fab fa-linkedin"></i>
                        </a>
                        <a href="https://www.instagram.com/sotiris.maf" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                            <i class="fab fa-instagram"></i>
                        </a>
                    </div>
                </div>

                <div class="contact-form-card">
                    <form id="my-form" action="https://formspree.io/f/xdalkzad" method="POST" novalidate>
                        
                        <!-- HONEYPOT FIELD (Για προστασία από Bots - Κρυμμένο από ανθρώπους) -->
                        <div style="display:none !important; visibility:hidden !important; position:absolute; left:-9999px;">
                            <label for="website_hp">Leave this blank</label>
                            <input type="text" id="website_hp" name="_gotcha" tabindex="-1" autocomplete="off">
                        </div>

                        <div class="input-group">
                            <label for="form-name">Ονοματεπώνυμο</label>
                            <input type="text" id="form-name" name="name" placeholder="John Doe" maxlength="80" required autocomplete="name">
                        </div>

                        <div class="input-group">
                            <label for="form-email">Email</label>
                            <input type="email" id="form-email" name="email" placeholder="john@example.com" maxlength="100" required autocomplete="email">
                        </div>

                        <div class="input-group">
                            <label for="form-message">Το μήνυμά σου</label>
                            <textarea id="form-message" name="message" rows="5" placeholder="Πώς μπορώ να βοηθήσω;" maxlength="2000" required></textarea>
                        </div>

                        <button type="submit" id="submit-btn" class="btn primary full-width">
                            <span id="btn-text">Αποστολή Μηνύματος</span>
                        </button>

                        <p id="form-status" style="margin-top: 15px; display: none; text-align: center; font-weight: 500;"></p>
                    </form>
                </div>

            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="scripts.js"></script>    
    <script src="contactscp.js"></script>
</body>
</html>
